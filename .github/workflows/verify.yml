name: Java build and smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac LibraryManagement.java
      - run: |
          printf '1\n10\nTest Book\nTest Author\nAvailable\n3\n10\n5\n' | java LibraryManagement > output.txt
          grep -q '10,Test Book,Test Author,Available' Library.txt
          grep -q 'Book Found!' output.txt
